# Oracle Native TUN Stack — Tailscale + code-server
#
# Deploy this file on the Oracle VPS host (NOT via Railway).
# Railway cannot supply /dev/net/tun; this design requires real kernel networking.
#
# Prerequisites on the Oracle host:
#   - Docker Engine installed (docker-ce + docker-compose-plugin)
#   - /dev/net/tun exists
#   - net.ipv4.ip_forward=1
#   - AirVPN WireGuard already running (wg-quick@airvpn or similar)
#   - Tailscale host daemon may be stopped/disabled if this container takes over
#
# Usage:
#   Copy this file to /opt/tailscale-stack/docker-compose.yml on the Oracle host.
#   Create /opt/tailscale-stack/.env with the required variables (see below).
#   Fill in a real CODE_SERVER_PASSWORD before startup.
#   Run (safe order):
#     docker compose up -d tailscale
#     sudo DEBIAN_FRONTEND=noninteractive apt-get install -y iptables-persistent netfilter-persistent
#     sudo iptables -C INPUT -p tcp --dport 8080 ! -i tailscale0 -j DROP 2>/dev/null \
#       || sudo iptables -I INPUT -p tcp --dport 8080 ! -i tailscale0 -j DROP
#     sudo netfilter-persistent save && sudo systemctl enable netfilter-persistent
#     docker compose up -d code-server
#   For reboot-safe startup, use a host systemd unit to start tailscale first,
#   then recreate code-server after tailscale is healthy (see README.md).
#
# Required .env variables:
#   TS_AUTHKEY=tskey-auth-...        # Tailscale one-off pre-auth key (safe with TS_AUTH_ONCE=true)
#   TS_HOSTNAME=oracle-ts            # Tailscale hostname for this node
#   CODE_SERVER_PASSWORD=            # code-server web UI password (required)
#
# Optional .env variables:
#   TS_EXTRA_ARGS=                   # Additional tailscale up / tailscale set args
#   TS_TAILSCALED_EXTRA_ARGS=        # Optional tailscaled daemon args

services:

  tailscale:
    image: tailscale/tailscale:v1.102.2@sha256:321ce041508c19079b57a28b6666c8d81ab0b08accc0a2585b3ab663d557ac24
    container_name: tailscale
    hostname: ${TS_HOSTNAME:-oracle-ts}
    restart: unless-stopped

    # Kernel TUN networking — no userspace, no SOCKS, no HTTP proxy.
    environment:
      TS_USERSPACE: "false"
      TS_STATE_DIR: /var/lib/tailscale
      TS_AUTHKEY: ${TS_AUTHKEY:?TS_AUTHKEY must be set in .env}
      # Authenticate only when not already logged in. This reuses the persisted
      # node state across restarts, so a one-off key can be used safely and the
      # enrollment credential is not retained beyond the first login.
      TS_AUTH_ONCE: "true"
      TS_HOSTNAME: ${TS_HOSTNAME:-oracle-ts}
      # TS_EXTRA_ARGS may include e.g. --advertise-exit-node.
      # Use TS_TAILSCALED_EXTRA_ARGS for tailscaled daemon flags.
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
      TS_TAILSCALED_EXTRA_ARGS: ${TS_TAILSCALED_EXTRA_ARGS:-}

    # Share the Oracle host network stack so Tailscale creates a real kernel
    # tailscale0 interface visible to the host and all service:tailscale consumers.
    network_mode: host

    # Capability required for kernel TUN and routing table manipulation.
    cap_add:
      - NET_ADMIN

    # Real /dev/net/tun — mandatory for TS_USERSPACE=false.
    devices:
      - /dev/net/tun:/dev/net/tun

    # Persist Tailscale node identity and state across container restarts/reboots.
    volumes:
      - tailscale-state:/var/lib/tailscale

    # Healthcheck: node is up when tailscale reports a Tailscale IP.
    healthcheck:
      test: ["CMD-SHELL", "tailscale ip 2>/dev/null | grep -q '^100\\.'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  code-server:
    image: codercom/code-server:4.132.0-debian@sha256:b88ed46a6ace76a0294a17a24f39aa88032ed0a3692c3d8ab5433b47ab57ccbf
    container_name: code-server
    # No Docker restart policy: a restart would rejoin a stale network namespace
    # when tailscale has been recreated. Runtime recovery is handled by the host
    # `tailscale-stack-recover.timer` (see README.md), which force-recreates
    # code-server whenever tailscale is healthy and code-server is down or its
    # shared network namespace has gone stale.
    restart: "no"
    user: "1000:1000"

    # Share the Tailscale container's network namespace.
    # code-server sees tailscale0 and the same routing table as the Tailscale
    # container. No separate Docker network. No proxy variables.
    network_mode: "service:tailscale"

    # This only affects `docker compose up`; host boot orchestration must
    # recreate code-server after tailscale becomes healthy.
    depends_on:
      tailscale:
        condition: service_healthy

    environment:
      PASSWORD: ${CODE_SERVER_PASSWORD:?CODE_SERVER_PASSWORD must be set in .env}
      # No ALL_PROXY, HTTP_PROXY, HTTPS_PROXY, or SOCKS variables.

    volumes:
      - code-server-data:/home/coder
      - code-server-workspace:/home/coder/workspace

    # Port 8080 is accessible via the tailscale0 interface (100.x.x.x:8080).
    # Because network_mode is service:tailscale and tailscale uses network_mode: host,
    # code-server's port 8080 also binds on the host's network interfaces.
    # Restrict access with a persistent host firewall rule before first start:
    #   sudo iptables -I INPUT -p tcp --dport 8080 ! -i tailscale0 -j DROP
    #   sudo netfilter-persistent save
    # or use persistent ufw/nftables rules equivalently.

volumes:
  tailscale-state:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/tailscale-stack/state
  code-server-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/tailscale-stack/coder-home
  code-server-workspace:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: /opt/tailscale-stack/workspace
